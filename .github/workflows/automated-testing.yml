name: Automated testing gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql poppler-utils
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-test-evidence
          path: output/automated-testing/
