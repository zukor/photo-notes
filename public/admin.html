<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Photo Notes — Admin</title>
  <meta name="theme-color" content="#1d4ed8" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .stat { display:inline-block; min-width:84px; margin:4px 14px 4px 0; vertical-align:top; }
    .stat .n { font-size:19px; font-weight:bold; color:#000; }
    .stat .l { font-size:12px; color:#000; }
    .userhead { font-weight:bold; font-size:17px; color:#000; }
    .muted { font-size:13px; color:#000; }
    .inactive { opacity:.55; }
    .pill.role { background:#000; color:#fff; border:none; }
    .pill.pro { background:#1d4ed8; color:#fff; border:none; }
    .section { margin-top:14px; }
    .section h4 { margin:0 0 4px; font-size:12px; font-weight:bold; text-transform:uppercase; letter-spacing:.04em; color:#000; border-bottom:1px solid #e3e6ea; padding-bottom:3px; }
    .statrow { margin-top:6px; }
    .privacy { font-size:12px; color:#000; margin-top:12px; padding-top:8px; border-top:1px solid #e3e6ea; }
    .helper { margin:4px 0 10px; font-size:13px; line-height:1.35; color:#000; }
    .user-title-row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .user-title-row .userhead { margin-right:3px; }
    .account-badges { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:5px 0; }
    .pill.basic { background:#fff; color:#000; border:1px solid #000; }
    .capture-stats { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:8px; }
    .capture-stats .stat { min-width:0; margin:4px 0; }
    .password-row { display:grid; grid-template-columns:minmax(0, 1fr) auto auto; gap:8px; margin-top:8px; }
    .password-row .btn { width:auto; margin:0; padding:10px 14px; font-size:14px; }
    .account-actions { margin-top:14px; padding-top:10px; border-top:1px solid #e3e6ea; }
    .account-actions .row { margin-top:8px; }
    .account-actions .btn { margin-top:0; padding:11px 8px; font-size:14px; }
    .reset-password-panel { margin-top:10px; padding:12px; border:1px solid #1d4ed8; border-radius:9px; background:#f4f7ff; }
    .reset-password-panel[hidden] { display:none; }
    .reset-password-panel label { margin:0 0 5px; }
    .reset-password-actions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:8px; }
    .reset-password-actions .btn { width:100%; }
    .admin-top-actions { display:flex; align-items:center; gap:14px; }
    .issue-admin-card { display:grid; grid-template-columns:180px minmax(0,1fr); gap:14px; }
    .issue-admin-card img { width:180px; max-height:220px; object-fit:cover; object-position:top; margin:0; border:1px solid #aaa; border-radius:6px; }
    .issue-description { white-space:pre-wrap; line-height:1.4; margin:8px 0; }
    @media (max-width:520px) {
      .capture-stats { grid-template-columns:repeat(3, minmax(0, 1fr)); }
      .password-row { grid-template-columns:1fr 1fr; }
      .password-row input { grid-column:1 / -1; }
      .account-actions .row { flex-direction:column; }
      .reset-password-actions { grid-template-columns:1fr; }
      .issue-admin-card { grid-template-columns:1fr; }
      .issue-admin-card img { width:100%; max-height:280px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const el = document.getElementById('app');
    async function api(path, opts = {}) { return fetch(path, { credentials: 'same-origin', ...opts }); }
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function fdate(d){ if(!d) return '—'; try { return new Date(d).toLocaleDateString(); } catch { return '—'; } }
    function fdatetime(d){ if(!d) return 'never'; try { return new Date(d).toLocaleString([], { year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit' }); } catch { return 'never'; } }
    function toast(msg){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2400); }
    function st(n, l){ return `<span class="stat"><div class="n">${n}</div><div class="l">${l}</div></span>`; }
    function num(v){ return Number(v) || 0; }
    let allUsers = [];
    let currentUser = null;
    function userInitials(user){
      const source=String((user && (user.name || user.email)) || 'User').trim();
      const words=source.split(/\s+/).filter(Boolean);
      return (words.length>1 ? words[0][0]+words[words.length-1][0] : source.slice(0,2)).toUpperCase();
    }

    function renderSummary(users){
      const box = document.getElementById('summary');
      if (!box) return;
      const people = users.length;
      const active = users.filter(u => u.active).length;
      const sum = (k) => users.reduce((a, u) => a + num(u[k]), 0);
      box.innerHTML = `
        <div class="card">
          <div class="statrow">
            ${st(people, 'users')}
            ${st(active, 'active users')}
            ${st(sum('capture_count'), 'total captures')}
            ${st(sum('last_7d'), 'captures, last 7 days')}
            ${st(sum('with_photo'), 'captures with photo')}
            ${st(sum('exports'), 'total exports')}
            ${st(sum('group_count'), 'total groups')}
          </div>
        </div>`;
    }

    function sortUsers(mode){
      const arr = allUsers.slice();
      const t = (d) => d ? new Date(d).getTime() : 0;
      if (mode === 'captures') arr.sort((a, b) => num(b.capture_count) - num(a.capture_count));
      else if (mode === 'last7') arr.sort((a, b) => num(b.last_7d) - num(a.last_7d));
      else if (mode === 'exports') arr.sort((a, b) => num(b.exports) - num(a.exports));
      else if (mode === 'newest') arr.sort((a, b) => t(b.created_at) - t(a.created_at));
      else if (mode === 'name') arr.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      else arr.sort((a, b) => t(b.last_activity) - t(a.last_activity)); // 'active' (default)
      return arr;
    }

    function renderUserList(){
      const box = document.getElementById('users');
      if (!box) return;
      const mode = (document.getElementById('sortsel') || {}).value || 'active';
      box.innerHTML = sortUsers(mode).map(u => userCard(u)).join('');
      box.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => toggleResetPassword(parseInt(b.getAttribute('data-reset'),10)));
      box.querySelectorAll('[data-recommend-password]').forEach(b => b.onclick = () => recommendResetPassword(parseInt(b.getAttribute('data-recommend-password'),10)));
      box.querySelectorAll('[data-copy-password]').forEach(b => b.onclick = () => copyResetPassword(parseInt(b.getAttribute('data-copy-password'),10)));
      box.querySelectorAll('[data-save-password]').forEach(b => b.onclick = () => saveResetPassword(parseInt(b.getAttribute('data-save-password'),10), b));
      box.querySelectorAll('[data-active]').forEach(b => b.onclick = () => setActive(parseInt(b.getAttribute('data-active'),10), b.getAttribute('data-to')==='1'));
      box.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => setPlan(parseInt(b.getAttribute('data-plan'),10), b.getAttribute('data-planto')));
    }

    function userCard(u){
      const orientedKnown = u.dims_known || 0;
      const photoLine = orientedKnown
        ? st(u.landscape, 'landscape') + st(u.portrait, 'portrait') + (u.square ? st(u.square, 'square') : '')
        : '<div class="muted">Orientation will appear as new photos come in.</div>';
      return `
        <div class="card ${u.active ? '' : 'inactive'}">
          <div class="user-title-row"><div class="userhead">${esc(u.name || u.email || '(unnamed user)')}</div>${u.active ? '' : '<span class="pill basic">Inactive</span>'}</div>
          <div class="account-badges">
            ${u.role==='admin' ? '<span class="pill role">Administrator Access</span>' : '<span class="pill basic">Standard Access</span>'}
            ${u.plan==='pro' ? '<span class="pill pro">Pro Plan</span>' : '<span class="pill basic">Basic Plan</span>'}
          </div>
          <div class="muted">${esc(u.email)}${u.industry ? ' · Industry: ' + esc(u.industry) : ''}</div>
          <div class="muted">Joined ${fdate(u.created_at)} · Last login ${fdatetime(u.last_login_at)} · Login count ${u.logins} · Last active ${fdatetime(u.last_activity)}</div>

          <div class="section">
            <h4>Captures</h4>
            <div class="statrow capture-stats">
              ${st(u.capture_count, 'total')}
              ${st(u.last_7d, 'last 7 days')}
              ${st(u.last_30d, 'last 30 days')}
              ${st(u.with_photo, 'with photo')}
              ${st(u.with_location, 'with location')}
              ${st(u.tasks, 'tasks')}
            </div>
            <div class="muted" style="margin-top:6px">${u.first_capture ? `First capture ${fdate(u.first_capture)} · Latest capture ${fdate(u.last_capture)}` : 'No captures yet.'}</div>
          </div>

          <div class="section">
            <h4>Photos (orientation)</h4>
            <div class="helper">Shows whether uploaded photos are landscape, portrait, or square. This helps identify device-use and report-format trends.</div>
            <div class="statrow">${photoLine}</div>
          </div>

          <div class="section">
            <h4>Notes (length only, text never shown)</h4>
            <div class="statrow">
              ${st(u.with_note, 'with a note')}
              ${st(u.note_chars_avg, 'avg characters')}
              ${st(u.note_chars_max, 'longest')}
              ${st(u.note_chars_total, 'total characters')}
              ${st(u.note_edits, 'edits')}
            </div>
          </div>

          <div class="section">
            <h4>Exports</h4>
            <div class="statrow">
              ${st(u.exports, 'total')}
              ${st(u.export_pdf, 'PDF')}
              ${st(u.export_docx, 'Word')}
              ${st(u.export_bundle, 'Claude .zip')}
            </div>
          </div>

          <div class="section">
            <h4>Groups</h4>
            <div class="statrow">
              ${st(u.group_count, 'groups')}
              ${st(u.grouped_photos, 'photos grouped')}
              ${st(u.group_adds, 'add actions')}
              ${st(u.reorders, 'reorders')}
            </div>
          </div>

          <div class="section">
            <h4>Other activity</h4>
            <div class="statrow">
              ${st(u.rotates, 'rotations')}
              ${st(u.deletes, 'delete actions')}
              ${st(u.fixes, 'address fixes')}
            </div>
          </div>

          <div class="privacy">Metadata only. This dashboard never shows their photos or the words they wrote.</div>

          <div class="account-actions">
            <h4>Account settings</h4>
            <div class="helper">Reset login credentials, change feature access, or prevent sign-in without deleting this user's data.</div>
            <div class="row">
              <button class="btn secondary" data-reset="${u.id}">Reset Password</button>
              <button class="btn secondary" data-plan="${u.id}" data-planto="${u.plan==='pro' ? 'free' : 'pro'}">${u.plan==='pro' ? 'Switch to Basic' : 'Upgrade to Pro'}</button>
              <button class="btn secondary" data-active="${u.id}" data-to="${u.active ? '0' : '1'}">${u.active ? 'Deactivate Login' : 'Reactivate Login'}</button>
            </div>
            <div class="reset-password-panel" id="reset-panel-${u.id}" hidden>
              <label for="reset-password-${u.id}">New Password</label>
              <input id="reset-password-${u.id}" type="text" autocomplete="new-password" placeholder="Enter or recommend a password" />
              <div class="reset-password-actions">
                <button class="btn secondary" type="button" data-recommend-password="${u.id}">Recommend Password</button>
                <button class="btn secondary" type="button" data-copy-password="${u.id}">Copy Password</button>
                <button class="btn" type="button" data-save-password="${u.id}">Save Password</button>
              </div>
              <div class="helper" id="reset-help-${u.id}">Recommended passwords are 10 characters and include uppercase, lowercase, numbers, and symbols.</div>
            </div>
          </div>
        </div>`;
    }

    async function boot(){
      const r = await api('/api/me');
      if (!r.ok) return renderLogin();
      const me = await r.json();
      if (me.role !== 'admin') return renderDenied();
      currentUser = me;
      renderAdmin();
    }

    function renderLogin(){
      el.innerHTML = `
        <div class="wrap">
          <h1>Photo Notes — Admin</h1>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" inputmode="email" />
          <label for="pw">Password</label>
          <input id="pw" type="password" autocomplete="current-password" />
          <button class="btn" id="loginBtn">Sign in</button>
          <p class="status" id="err"></p>
        </div>`;
      document.getElementById('loginBtn').onclick = doLogin;
      document.getElementById('pw').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
    }
    async function doLogin(){
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('pw').value;
      const r = await api('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password: pw }) });
      if (r.ok) boot(); else document.getElementById('err').textContent = 'Wrong email or password.';
    }

    function renderDenied(){
      el.innerHTML = `
        <div class="wrap">
          <h1>Photo Notes — Admin</h1>
          <p class="status" style="color:#000">This area is for administrators only.</p>
          <a class="btn" href="/" style="text-align:center;text-decoration:none">Back to the app</a>
        </div>`;
    }

    function renderAdmin(){
      el.innerHTML = `
        <div class="wrap">
          <div class="topbar">
            <strong>Photo Notes — Admin</strong>
            <div class="admin-top-actions">
              <a class="link" href="/">Open App</a>
              <div class="account-menu-wrap">
                <button class="profile-button" id="profileButton" type="button" aria-label="Account menu" aria-expanded="false">${esc(userInitials(currentUser))}</button>
                <div class="profile-menu" id="profileMenu" hidden>
                  <div class="profile-name">${esc((currentUser && currentUser.name) || 'Administrator')}</div>
                  <div class="profile-email">${esc((currentUser && currentUser.email) || '')}</div>
                  <div class="profile-plan">${currentUser && currentUser.plan === 'pro' ? 'Asphalt Pro Plan' : 'Basic Plan'} · Administrator</div>
                  <a href="/">Open Photo Notes</a>
                  <button type="button" id="signout">Sign Out</button>
                </div>
              </div>
            </div>
          </div>

          <label style="margin-top:8px">Create a Login</label>
          <div class="helper">Create access for a person. First name, last name, email, and password are required; industry is optional.</div>
          <input id="cname" type="text" placeholder="First and last name" autocomplete="name" />
          <input id="cemail" type="email" placeholder="Email" inputmode="email" autocomplete="email" style="margin-top:8px" />
          <input id="cindustry" type="text" placeholder="Industry (optional)" style="margin-top:8px" />
          <div class="password-row">
            <input id="cpass" type="text" placeholder="Create Password" autocomplete="new-password" />
            <button class="btn secondary" type="button" id="generatepass">Generate</button>
            <button class="btn secondary" type="button" id="copypass">Copy Password</button>
          </div>
          <div class="helper" id="passhelp">Use Generate for a strong 20-character password, then copy it before creating the login.</div>
          <button class="btn" id="createbtn">Create Login</button>

          <label style="margin-top:22px">Totals Across All Users</label>
          <div class="helper">Combined account and activity counts for every user listed below.</div>
          <div id="summary"></div>

          <label style="margin-top:22px">Tester Issue Reports</label>
          <div class="helper">Reports sent from Photo Notes Basic, including the page screenshot and the tester’s spoken or typed description.</div>
          <div id="issues"><p class="status">Loading...</p></div>

          <div class="row" style="margin-top:18px; align-items:center; gap:10px">
            <label style="margin:0">Users &amp; Usage</label>
            <select id="sortsel" style="margin-left:auto; max-width:230px">
              <option value="active">Sort: most recently active</option>
              <option value="captures">Sort: most captures</option>
              <option value="last7">Sort: most active (last 7 days)</option>
              <option value="exports">Sort: most exports</option>
              <option value="newest">Sort: newest login</option>
              <option value="name">Sort: name (A–Z)</option>
            </select>
          </div>
          <div id="users"></div>
        </div>`;
      const profileButton=document.getElementById('profileButton');
      const profileMenu=document.getElementById('profileMenu');
      profileButton.onclick=(e)=>{ e.stopPropagation(); profileMenu.hidden=!profileMenu.hidden; profileButton.setAttribute('aria-expanded',String(!profileMenu.hidden)); };
      document.onclick=(e)=>{ if(!e.target.closest('.account-menu-wrap')){ profileMenu.hidden=true; profileButton.setAttribute('aria-expanded','false'); } };
      document.getElementById('signout').onclick = async () => { await api('/api/logout', { method:'POST' }); currentUser=null; renderLogin(); };
      document.getElementById('createbtn').onclick = createUser;
      document.getElementById('generatepass').onclick = generatePassword;
      document.getElementById('copypass').onclick = copyPassword;
      loadIssues();
      loadUsers();
    }

    async function loadIssues(){
      const box=document.getElementById('issues'); if(!box)return;
      try{const r=await api('/api/admin/issues');if(!r.ok)throw new Error();const rows=await r.json();box.innerHTML=rows.length?rows.map(i=>`<article class="card issue-admin-card">${i.screenshot_path?`<a href="${esc(i.screenshot_path)}" target="_blank" rel="noopener"><img src="${esc(i.screenshot_path)}" alt="Issue ${i.id} screenshot"></a>`:'<div class="muted">No screenshot</div>'}<div><div class="user-title-row"><div class="userhead">Issue #${i.id}: ${esc(i.page_name||'Photo Notes')}</div><span class="pill ${i.email_status==='sent'?'pro':'basic'}">Email ${esc(i.email_status||'pending')}</span></div><div class="muted">${esc(i.user_name||i.user_email)} · ${fdatetime(i.created_at)} · ${esc(i.viewport||'screen unknown')}</div><div class="issue-description">${esc(i.description)}</div><div class="muted">${esc(i.page_url||'')}</div></div></article>`).join(''):'<p class="helper">No tester issues have been reported yet.</p>';}
      catch(e){box.innerHTML='<p class="status">Issue reports could not be loaded.</p>';}
    }

    function generatePassword(){
      const chars=strongPasswordCharacters(20);
      document.getElementById('cpass').value=chars;
      document.getElementById('passhelp').textContent='Strong password generated. Copy it before creating the login.';
    }

    function strongPasswordCharacters(length){
      const upper='ABCDEFGHJKLMNPQRSTUVWXYZ', lower='abcdefghijkmnopqrstuvwxyz', digits='23456789', symbols='!@#$%*-_';
      const all=upper+lower+digits+symbols;
      const pick=(chars) => chars[crypto.getRandomValues(new Uint32Array(1))[0] % chars.length];
      const chars=[pick(upper),pick(lower),pick(digits),pick(symbols)];
      while(chars.length<length) chars.push(pick(all));
      for(let i=chars.length-1;i>0;i--){ const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1); [chars[i],chars[j]]=[chars[j],chars[i]]; }
      return chars.join('');
    }

    async function copyPassword(){
      const input=document.getElementById('cpass');
      if(!input.value){ toast('Generate or enter a password first'); return; }
      try { await navigator.clipboard.writeText(input.value); toast('Password copied'); }
      catch(e){ input.select(); document.execCommand('copy'); toast('Password copied'); }
    }

    async function createUser(){
      const name = document.getElementById('cname').value.trim();
      const email = document.getElementById('cemail').value.trim();
      const industry = document.getElementById('cindustry').value.trim();
      const password = document.getElementById('cpass').value;
      if (name.split(/\s+/).filter(Boolean).length < 2) { toast('First and last name are required'); return; }
      if (!email || !password) { toast('Email and password are required'); return; }
      const btn = document.getElementById('createbtn'); btn.disabled = true; btn.textContent = 'Creating...';
      try {
        const r = await api('/api/admin/users', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, email, industry, password }) });
        if (r.status === 409) { toast('That email already has a login'); }
        else if (!r.ok) { toast('Could not create login'); }
        else {
          toast('Login created');
          document.getElementById('cname').value=''; document.getElementById('cemail').value='';
          document.getElementById('cindustry').value=''; document.getElementById('cpass').value='';
          loadUsers();
        }
      } catch(e){ toast('Could not create login'); }
      finally { btn.disabled = false; btn.textContent = 'Create Login'; }
    }

    async function loadUsers(){
      const box = document.getElementById('users');
      box.innerHTML = '<p class="status">Loading...</p>';
      const r = await api('/api/admin/users');
      if (!r.ok) { box.innerHTML = '<p class="status">Could not load.</p>'; return; }
      allUsers = await r.json();
      renderSummary(allUsers);
      const sortsel = document.getElementById('sortsel');
      if (sortsel && !sortsel._wired) { sortsel._wired = true; sortsel.onchange = renderUserList; }
      renderUserList();
    }

    function toggleResetPassword(id){
      const panel=document.getElementById(`reset-panel-${id}`);
      if(!panel)return;
      panel.hidden=!panel.hidden;
      if(!panel.hidden) document.getElementById(`reset-password-${id}`).focus();
    }
    function recommendResetPassword(id){
      const input=document.getElementById(`reset-password-${id}`);
      input.value=strongPasswordCharacters(10);
      document.getElementById(`reset-help-${id}`).textContent='Strong 10-character password recommended. Copy it, then save it.';
      input.focus(); input.select();
    }
    async function copyResetPassword(id){
      const input=document.getElementById(`reset-password-${id}`);
      if(!input.value){toast('Recommend or enter a password first');return;}
      try{await navigator.clipboard.writeText(input.value);toast('Password copied');}
      catch(e){input.select();document.execCommand('copy');toast('Password copied');}
    }
    async function saveResetPassword(id,btn){
      const input=document.getElementById(`reset-password-${id}`),pw=input.value;
      if(pw.length<10){toast('Password must be at least 10 characters');input.focus();return;}
      btn.disabled=true;btn.textContent='Saving...';
      try{
        const r=await api(`/api/admin/users/${id}/password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
        if(!r.ok)throw new Error();
        toast('Password saved');
        document.getElementById(`reset-help-${id}`).textContent='Password saved. Give the copied password to the user securely.';
      }catch(e){toast('Password could not be saved');}
      finally{btn.disabled=false;btn.textContent='Save Password';}
    }
    async function setActive(id, active){
      if (!active && !confirm('Deactivate this login? They will not be able to sign in. Their data is kept.')) return;
      const r = await api(`/api/admin/users/${id}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ active }) });
      if (r.ok) { toast(active ? 'Activated' : 'Deactivated'); loadUsers(); } else toast('Update failed');
    }
    async function setPlan(id, plan){
      const r = await api(`/api/admin/users/${id}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ plan }) });
      if (r.ok) { toast(plan === 'pro' ? 'Upgraded to Pro' : 'Switched to Basic'); loadUsers(); } else toast('Update failed');
    }

    boot();
  </script>
</body>
</html>
