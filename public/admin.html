<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Photo Notes — Admin</title>
  <meta name="theme-color" content="#1d4ed8" />
  <link rel="stylesheet" href="/styles.css?v=194" />
  <script src="/vendor/html2canvas.min.js?v=59"></script>
  <script src="/issue-markup.js?v=194"></script>
  <script src="/issue-reporter.js?v=194"></script>
  <style>
    .stat { display:inline-block; min-width:84px; margin:4px 14px 4px 0; vertical-align:top; }
    .stat .n { font-size:19px; font-weight:bold; color:#000; }
    .stat .l { font-size:12px; color:#000; }
    .userhead { font-weight:bold; font-size:17px; color:#000; }
    .muted { font-size:13px; color:#000; }
    .inactive { opacity:.55; }
    .pill.role { background:#000; color:#fff; border:none; }
    .pill.pro { background:#1d4ed8; color:#fff; border:none; }
    .section { margin-top:14px; }
    .section h4 { margin:0 0 4px; font-size:12px; font-weight:bold; text-transform:uppercase; letter-spacing:.04em; color:#000; border-bottom:1px solid #e3e6ea; padding-bottom:3px; }
    .statrow { margin-top:6px; }
    .privacy { font-size:12px; color:#000; margin-top:12px; padding-top:8px; border-top:1px solid #e3e6ea; }
    .helper { margin:4px 0 10px; font-size:13px; line-height:1.35; color:#000; }
    .user-title-row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .user-title-row .userhead { margin-right:3px; }
    .account-badges { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:5px 0; }
    .pill.basic { background:#fff; color:#000; border:1px solid #000; }
    .capture-stats { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:8px; }
    .capture-stats .stat { min-width:0; margin:4px 0; }
    .password-row { display:grid; grid-template-columns:minmax(0, 1fr) auto auto; gap:8px; margin-top:8px; }
    .password-row .btn { width:auto; margin:0; padding:10px 14px; font-size:14px; }
    .account-actions { margin-top:14px; padding-top:10px; border-top:1px solid #e3e6ea; }
    .account-actions .row { margin-top:8px; }
    .account-actions .btn { margin-top:0; padding:11px 8px; font-size:14px; }
    .reset-password-panel { margin-top:10px; padding:12px; border:1px solid #1d4ed8; border-radius:9px; background:#f4f7ff; }
    .reset-password-panel[hidden] { display:none; }
    .reset-password-panel label { margin:0 0 5px; }
    .reset-password-actions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:8px; }
    .reset-password-actions .btn { width:100%; }
    .admin-top-actions { display:flex; align-items:center; gap:14px; }
    .issue-admin-card { display:grid; grid-template-columns:180px minmax(0,1fr); gap:14px; }
    .issue-admin-card img { width:180px; max-height:220px; object-fit:cover; object-position:top; margin:0; border:1px solid #aaa; border-radius:6px; }
    .issue-description { white-space:pre-wrap; line-height:1.4; margin:8px 0; }
    .issue-toolbar { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)) auto; gap:8px; align-items:end; margin:10px 0; }
    .issue-toolbar label { margin:0; font-size:12px; }
    .issue-toolbar select { margin-top:4px; }
    .issue-controls { display:grid; grid-template-columns:minmax(0,180px) minmax(0,180px); gap:8px; margin-top:10px; }
    .issue-controls label { margin:0; font-size:12px; }
    .issue-controls select { margin-top:4px; }
    .issue-notes { margin-top:8px; min-height:76px; }
    .issue-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .issue-actions .btn { width:auto; margin:0; padding:9px 14px; font-size:14px; }
    .issue-summary { display:flex; gap:7px; flex-wrap:wrap; margin:8px 0; }
    .issue-comparison { margin:8px 0 12px; padding:10px; border:1px solid #cdd3dc; border-radius:8px; background:#f8fafc; font-size:13px; line-height:1.45; }
    .issue-device { display:inline-block; margin-left:5px; padding:2px 7px; border:1px solid #64748b; border-radius:999px; font-size:11px; color:#172033; background:#fff; }
    .health-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
    .health-card { border:1px solid #cdd3dc; border-radius:9px; padding:11px; background:#fff; }
    .health-name { font-weight:bold; display:flex; align-items:center; gap:7px; }
    .health-dot { width:10px; height:10px; border-radius:50%; background:#1b7a3d; flex:0 0 auto; }
    .health-dot.warning { background:#b36b00; }
    .health-dot.down { background:#b3261e; }
    .health-detail { font-size:12px; margin-top:5px; line-height:1.3; }
    .health-meta { margin:8px 0 10px; }
    .admin-panel { margin-top:10px; padding:12px; border:1px solid #cdd3dc; border-radius:9px; background:#f8fafc; }
    .admin-panel[hidden] { display:none; }
    .edit-user-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .feature-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:8px; }
    .feature-item { display:flex; align-items:flex-start; gap:8px; border:1px solid #dbe0e7; border-radius:7px; padding:9px; background:#fff; font-size:13px; text-transform:none; letter-spacing:0; }
    .feature-item input { width:18px; height:18px; margin:0; flex:0 0 auto; }
    .activity-table { width:100%; border-collapse:collapse; font-size:13px; }
    .activity-table th,.activity-table td { text-align:left; padding:8px; border-bottom:1px solid #e3e6ea; vertical-align:top; }
    .usage-row { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; }
    .assignment-admin-card { border-left:6px solid #2455d9; }
    .assignment-admin-card.submitted { border-left-color:#1b7a3d; }
    .assignment-admin-card .assignment-progress { height:9px; border:1px solid #2455d9; border-radius:999px; overflow:hidden; margin:8px 0; }
    .assignment-admin-card .assignment-progress span { display:block; height:100%; background:#2455d9; }
    @media (max-width:520px) {
      .capture-stats { grid-template-columns:repeat(3, minmax(0, 1fr)); }
      .password-row { grid-template-columns:1fr 1fr; }
      .password-row input { grid-column:1 / -1; }
      .account-actions .row { flex-direction:column; }
      .reset-password-actions { grid-template-columns:1fr; }
      .issue-admin-card { grid-template-columns:1fr; }
      .issue-admin-card img { width:100%; max-height:280px; }
      .issue-toolbar, .issue-controls, .health-grid, .edit-user-grid, .feature-grid, .usage-row { grid-template-columns:1fr; }
    }

    .wrap { max-width:1080px; }
    [hidden] { display:none !important; }
    .users-heading { display:flex; gap:20px; align-items:center; justify-content:space-between; margin:24px 0 18px; }
    .users-heading h1 { margin:0 0 5px; font-size:30px; text-align:left; }
    .users-heading > div,.user-list-copy,.user-list-copy strong { text-align:left; }
    .users-heading .btn { width:auto; flex:none; margin:0; }
    .user-list-tools { display:grid; grid-template-columns:1fr 210px; gap:14px; margin-bottom:16px; }
    .user-list-tools label { margin:0; text-transform:none; letter-spacing:0; }
    .user-list-tools input { width:100%; padding:12px; border:1px solid #b7c2d1; border-radius:8px; font:inherit; margin-top:5px; }
    .user-list-item { display:flex; align-items:center; gap:14px; width:100%; padding:17px; margin:0 0 9px; text-align:left; background:#fff; color:#111; border:1px solid #ccd5e2; border-radius:10px; cursor:pointer; font:inherit; }
    .user-list-item:hover { border-color:#1d4ed8; background:#f4f7ff; }
    .user-list-item:focus-visible, summary:focus-visible { outline:3px solid #1d4ed8; outline-offset:2px; }
    .user-avatar { display:grid; place-items:center; width:42px; height:42px; flex:none; border-radius:50%; background:#e9f0ff; color:#1644a8; font-weight:bold; }
    .user-list-copy { display:flex; flex:1; min-width:0; flex-direction:column; gap:4px; overflow-wrap:anywhere; }
    .user-list-copy strong { font-size:17px; }
    .user-list-copy small { font-size:12px; }
    .user-list-status { flex:none; font-size:12px; }
    .admin-tools-heading { margin:30px 0 14px; font-size:20px; }
    .admin-section { border:1px solid #ccd5e2; border-radius:10px; background:#fff; margin:10px 0; }
    .admin-section > summary { padding:17px; font-size:16px; font-weight:bold; cursor:pointer; }
    .admin-section[open] > summary { border-bottom:1px solid #e3e9f0; }
    .admin-section-body, .admin-section > .section, .admin-section > .privacy, .admin-section > #activity, .admin-section > .helper { margin:14px; }
    .version-access { margin:22px 0; border:1px solid #b9c9e1; border-radius:10px; padding:16px; min-width:0; }
    .version-access legend { padding:0 6px; font-size:19px; font-weight:bold; }
    .version-access .btn { width:auto; }
    .account-actions .row { flex-wrap:wrap; }
    .account-actions .btn { width:auto; flex:0 1 auto; padding:11px 15px; }
    .activity-table { overflow-wrap:anywhere; }
    @media(max-width:600px) {
      .users-heading { align-items:flex-start; gap:10px; }
      .users-heading .btn { padding:10px; font-size:14px; }
      .user-list-tools { grid-template-columns:1fr; }
      .user-list-item { gap:10px; padding:12px; }
      .user-list-status { max-width:50px; }
      .feature-grid { grid-template-columns:1fr; }
      .account-actions .row { flex-direction:row; }
    }
    .delete-user-button { border:1px solid #b42318; background:#fff; color:#b42318; }
    .delete-user-button:hover { background:#fff1ef; border-color:#b42318; }
    .delete-user-panel { border-color:#b42318; background:#fff8f7; overflow-wrap:anywhere; }
    .wrap { padding-bottom:80px; }
    .delete-user-panel label { text-transform:none; }
    .delete-user-panel h3 { margin-top:0; }
    .delete-user-panel .btn { margin:10px 8px 0 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const el = document.getElementById('app');
    async function api(path, opts = {}) { return fetch(path, { credentials: 'same-origin', ...opts }); }
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function fdate(d){ if(!d) return '—'; try { return new Date(d).toLocaleDateString(); } catch { return '—'; } }
    function fdatetime(d){ if(!d) return 'never'; try { return new Date(d).toLocaleString([], { year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit' }); } catch { return 'never'; } }
    function toast(msg){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);} t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2400); }
    function st(n, l){ return `<span class="stat"><div class="n">${n}</div><div class="l">${l}</div></span>`; }
    function num(v){ return Number(v) || 0; }
    let allUsers = [], selectedUserId = null;
    const editionLabels={basic:'Photo Notes Basic',pro:'Photo Notes Pro',contractor:'General Contractor Pro',roads:'Road Issue Reporter',paving:'Paving Pro',hoa:'HOA Maintenance Pro',concrete:'Concrete Pro',roofer:'Roofer Pro'};
    function allowedVersions(u){return Array.isArray(u.edition_access)?u.edition_access:u.role==='admin'?Object.keys(editionLabels):[u.plan==='pro'?(u.pro_type==='general'?'pro':u.pro_type||'paving'):u.pro_type==='roads'?'roads':'basic'];}
    function versionChecks(owner,access){return Object.entries(editionLabels).map(([key,label])=>`<label class="feature-item"><input type="checkbox" data-version-owner="${owner}" value="${key}" ${access.includes(key)?'checked':''}><span>${label}</span></label>`).join('');}
    function showUser(id){selectedUserId=id;renderUserList();document.getElementById('users').scrollIntoView({block:'start'});document.getElementById(id?'backToUsers':'userSearch').focus();}
    async function saveVersions(id,btn){
      const edition_access=[...document.querySelectorAll(`[data-version-owner="${id}"]:checked`)].map(x=>x.value);
      if(!edition_access.length){toast('Select at least one version');return;}
      btn.disabled=true;btn.textContent='Saving...';
      try{const r=await api(`/api/admin/users/${id}/versions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edition_access})});if(!r.ok)throw new Error();await loadUsers();toast('Version access saved');}
      catch(e){toast('Version access could not be saved');}
      finally{btn.disabled=false;btn.textContent='Save Versions';}
    }

    let allIssues = [];
    let allAssignments = [];
    let usageByUser = {};
    let currentUser = null;
    function userInitials(user){
      const source=String((user && (user.name || user.email)) || 'User').trim();
      const words=source.split(/\s+/).filter(Boolean);
      return (words.length>1 ? words[0][0]+words[words.length-1][0] : source.slice(0,2)).toUpperCase();
    }

    function renderSummary(users){
      const box = document.getElementById('summary');
      if (!box) return;
      const people = users.length;
      const active = users.filter(u => u.active).length;
      const sum = (k) => users.reduce((a, u) => a + num(u[k]), 0);
      box.innerHTML = `
        <div class="card">
          <div class="statrow">
            ${st(people, 'users')}
            ${st(active, 'active users')}
            ${st(sum('capture_count'), 'total captures')}
            ${st(sum('last_7d'), 'captures, last 7 days')}
            ${st(sum('with_photo'), 'captures with photo')}
            ${st(sum('exports'), 'total exports')}
            ${st(sum('group_count'), 'total groups')}
          </div>
        </div>`;
    }

    function sortUsers(mode){
      const arr = allUsers.slice();
      const t = (d) => d ? new Date(d).getTime() : 0;
      if (mode === 'captures') arr.sort((a, b) => num(b.capture_count) - num(a.capture_count));
      else if (mode === 'last7') arr.sort((a, b) => num(b.last_7d) - num(a.last_7d));
      else if (mode === 'exports') arr.sort((a, b) => num(b.exports) - num(a.exports));
      else if (mode === 'newest') arr.sort((a, b) => t(b.created_at) - t(a.created_at));
      else if (mode === 'name') arr.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      else arr.sort((a, b) => t(b.last_activity) - t(a.last_activity)); // 'active' (default)
      return arr;
    }

    function renderUserList(){
      const box = document.getElementById('users');
      if (!box) return;
      const mode = (document.getElementById('sortsel') || {}).value || 'active';
      document.getElementById('userListTools').hidden=!!selectedUserId;
      if(!selectedUserId){
        const query=document.getElementById('userSearch').value.trim().toLowerCase();
        const users=sortUsers(mode).filter(u=>[u.name,u.email].join(' ').toLowerCase().includes(query));
        box.innerHTML=users.length?users.map(u=>`<button class="user-list-item" type="button" data-open-user="${u.id}"><span class="user-avatar" aria-hidden="true">${esc(userInitials(u))}</span><span class="user-list-copy"><strong>${esc(u.name||u.email)}</strong><span>${esc(u.email)}</span><small>${esc(allowedVersions(u).length>2?allowedVersions(u).length+' versions':allowedVersions(u).map(k=>editionLabels[k]).join(' · '))}</small></span><span class="user-list-status">${u.active?'Active':'Inactive'}<span aria-hidden="true"> →</span></span></button>`).join(''):'<p class="status">No users found.</p>';
        box.querySelectorAll('[data-open-user]').forEach(b=>b.onclick=()=>showUser(Number(b.dataset.openUser)));return;
      }
      const user=allUsers.find(u=>u.id===selectedUserId);if(!user){selectedUserId=null;return renderUserList();}
      box.innerHTML='<button class="backlink" type="button" id="backToUsers">← All Users</button>'+userCard(user);
      document.getElementById('backToUsers').onclick=()=>showUser(null);
      box.querySelectorAll('[data-save-versions]').forEach(b=>b.onclick=()=>saveVersions(Number(b.dataset.saveVersions),b));

      box.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => toggleResetPassword(parseInt(b.getAttribute('data-reset'),10)));
      box.querySelectorAll('[data-recommend-password]').forEach(b => b.onclick = () => recommendResetPassword(parseInt(b.getAttribute('data-recommend-password'),10)));
      box.querySelectorAll('[data-copy-password]').forEach(b => b.onclick = () => copyResetPassword(parseInt(b.getAttribute('data-copy-password'),10)));
      box.querySelectorAll('[data-save-password]').forEach(b => b.onclick = () => saveResetPassword(parseInt(b.getAttribute('data-save-password'),10), b));
      box.querySelectorAll('[data-delete-user]').forEach(b=>b.onclick=()=>prepareDeleteUser(Number(b.dataset.deleteUser),b));
      box.querySelectorAll('[data-active]').forEach(b => b.onclick = () => setActive(parseInt(b.getAttribute('data-active'),10), b.getAttribute('data-to')==='1'));
      box.querySelectorAll('[data-edit-user]').forEach(b => b.onclick = () => toggleAdminPanel(`edit-user-${b.dataset.editUser}`));
      box.querySelectorAll('[data-save-user]').forEach(b => b.onclick = () => saveUserDetails(Number(b.dataset.saveUser), b));
      box.querySelectorAll('[data-save-tester]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await api(`/api/admin/users/${b.dataset.saveTester}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_tester:box.querySelector('[data-tester]').checked})});if(!r.ok)throw Error();await loadUsers();toast('Tester access saved');}catch{toast('Tester access could not be saved');}finally{b.disabled=false;}});
      box.querySelectorAll('[data-save-features]').forEach(b => b.onclick = () => saveFeatureAccess(Number(b.dataset.saveFeatures), b));
    }

    function userCard(u){
      const usage=usageByUser[u.id]||{}, features=u.feature_access||{};
      const orientedKnown = u.dims_known || 0;
      const photoLine = orientedKnown
        ? st(u.landscape, 'landscape') + st(u.portrait, 'portrait') + (u.square ? st(u.square, 'square') : '')
        : '<div class="muted">Orientation will appear as new photos come in.</div>';
      return `
        <div class="card ${u.active ? '' : 'inactive'}">
          <div class="user-title-row"><div class="userhead">${esc(u.name || u.email || '(unnamed user)')}</div>${u.active ? '' : '<span class="pill basic">Inactive</span>'}</div>
          <div class="account-badges">
            ${u.role==='admin' ? '<span class="pill role">Administrator Access</span>' : '<span class="pill basic">Standard Access</span>'}
            <span class="pill basic">Currently using: ${esc(editionLabels[u.plan==='pro'?(u.pro_type==='general'?'pro':u.pro_type):u.pro_type==='roads'?'roads':'basic'])}</span>
          </div>
          <div class="muted">${esc(u.email)}${u.industry ? ' · Industry: ' + esc(u.industry) : ''}</div>
          <div class="muted">Joined ${fdate(u.created_at)} · Last login ${fdatetime(u.last_login_at)} · Login count ${num(u.logins)} · Last active ${fdatetime(u.last_activity)}</div>

          <div class="account-actions">
            <h4>Account settings</h4>
            <div class="helper">Edit login details and access, deactivate the login, or permanently delete the user.</div>
            <div class="row">
              <button class="btn secondary" data-edit-user="${u.id}">Edit</button>
              <button class="btn secondary" data-reset="${u.id}">Reset Password</button>
              <button class="btn secondary" data-active="${u.id}" data-to="${u.active ? '0' : '1'}">${u.active ? 'Deactivate Login' : 'Reactivate Login'}</button>
              <button class="btn delete-user-button" type="button" data-delete-user="${u.id}">Delete User</button>
            </div>
            <div class="admin-panel delete-user-panel" id="delete-user-${u.id}" hidden></div>
            <div class="admin-panel" id="edit-user-${u.id}" hidden><h4>Edit User</h4><div class="edit-user-grid"><label>First and Last Name<input id="edit-name-${u.id}" value="${esc(u.name||'')}"></label><label>Email<input id="edit-email-${u.id}" type="email" value="${esc(u.email||'')}"></label><label>Industry<input id="edit-industry-${u.id}" value="${esc(u.industry||'')}"></label></div><button class="btn" type="button" data-save-user="${u.id}" style="margin-top:8px">Save User</button></div>
            ${allowedVersions(u).includes('paving')?`<div class="admin-panel"><h4>Paving Pro Options</h4><div class="helper">Optional Paving Pro features. These settings apply whenever this user opens Paving Pro.</div><div class="feature-grid">${featureToggle(u.id,'ticket_scanner','Paving Ticket Scanner',features)}${featureToggle(u.id,'camera_readers','Camera Readers & Scanners',features)}${featureToggle(u.id,'before_after','Before & After Matching',features)}${featureToggle(u.id,'measurements','Measurements, Map & AI Classification',features)}${featureToggle(u.id,'extra_work','Extra Work Records',features)}</div><button class="btn" type="button" data-save-features="${u.id}">Save Feature Access</button></div>`:''}
            <div class="reset-password-panel" id="reset-panel-${u.id}" hidden>
              <label for="reset-password-${u.id}">New Password</label>
              <input id="reset-password-${u.id}" type="password" autocomplete="new-password" placeholder="Enter or recommend a password" />
              <div class="reset-password-actions">
                <button class="btn secondary" type="button" data-recommend-password="${u.id}">Recommend Password</button>
                <button class="btn secondary" type="button" data-copy-password="${u.id}">Copy Password</button>
                <button class="btn" type="button" data-save-password="${u.id}">Save Password</button>
              </div>
              <div class="helper" id="reset-help-${u.id}">Recommended passwords are 10 characters and include uppercase, lowercase, numbers, and symbols.</div>
            </div>
          </div>
          <fieldset class="version-access"><legend>Testing</legend><label class="feature-item"><input type="checkbox" data-tester="${u.id}" ${u.is_tester?'checked':''}>Tester</label><p class="helper">Gives this user a Testing Hub for their own reports and an alert when a fix is ready to retest.</p><button class="btn" type="button" data-save-tester="${u.id}">Save Tester Access</button></fieldset>
          <fieldset class="version-access"><legend>Versions</legend><p class="helper">Check every version this user can open. They can switch between their selected versions in the app.</p><div class="feature-grid">${versionChecks(u.id,allowedVersions(u))}</div><button class="btn" type="button" data-save-versions="${u.id}">Save Versions</button></fieldset>
<details class="admin-section"><summary>Usage &amp; Activity</summary>          <div class="section">
            <h4>Captures</h4>
            <div class="statrow capture-stats">
              ${st(u.capture_count, 'total')}
              ${st(u.last_7d, 'last 7 days')}
              ${st(u.last_30d, 'last 30 days')}
              ${st(u.with_photo, 'with photo')}
              ${st(u.with_location, 'with location')}
              ${st(u.tasks, 'tasks')}
            </div>
            <div class="muted" style="margin-top:6px">${u.first_capture ? `First capture ${fdate(u.first_capture)} · Latest capture ${fdate(u.last_capture)}` : 'No captures yet.'}</div>
          </div>

          <div class="section">
            <h4>Photos (orientation)</h4>

    function assignmentCard(a){const steps=Array.isArray(a.steps)?a.steps:[],done=new Set((Array.isArray(a.completed_step_ids)?a.completed_step_ids:[]).map(String)),percent=steps.length?Math.round(done.size/steps.length*100):0,name=a.user_name||a.assignee_name,email=a.user_email||a.assignee_email||'login not connected';return `<article class="card assignment-admin-card ${a.status==='submitted'?'submitted':''}"><div class="user-title-row"><div class="userhead">${esc(name)} — ${esc(a.title)}</div><span class="pill ${a.status==='submitted'?'pro':'basic'}">${a.status==='submitted'?'Submitted':a.status==='in_progress'?'In Progress':'Assigned'}</span></div><div class="muted">${esc(email)} · ${done.size} of ${steps.length} checks complete${a.submitted_at?' · Submitted '+fdatetime(a.submitted_at):''}</div><div class="assignment-progress"><span style="width:${percent}%"></span></div>${a.user_id?'':'<div class="helper"><b>Waiting for matching login.</b> The assignment will connect automatically when this tester signs in with a matching name.</div>'}${a.tester_notes?`<div class="admin-panel"><b>Tester notes</b><br>${esc(a.tester_notes)}</div>`:''}<details><summary>Checklist progress</summary>${steps.map((s,i)=>`<div class="muted" style="padding:5px 0">${done.has(String(s.id))?'✓':'○'} ${i+1}. ${esc(s.title)}</div>`).join('')}</details></article>`;}
    async function loadAssignments(){const box=document.getElementById('assignments');if(!box)return;box.innerHTML='<p class="status">Loading...</p>';try{const r=await api('/api/admin/testing-assignments');if(!r.ok)throw new Error();allAssignments=await r.json();box.innerHTML=allAssignments.length?allAssignments.map(assignmentCard).join(''):'<p class="helper">No assignments are configured.</p>';}catch(e){box.innerHTML='<p class="status">Testing assignments could not be loaded.</p>';}}

    const issueStatusLabels={blocked:'Needs Information / Blocked',new:'New',reviewing:'Reviewing',fixing:'Working',testing:'Testing',ready_to_test:'Deployed - Awaiting Confirmation',tester_confirmed:'Tester Confirmed',resolved:'Resolved',wont_fix:'Won’t Fix'};
    const issuePriorityLabels={low:'Low',normal:'Normal',high:'High',urgent:'Urgent'};
    function issueDevice(i){const ua=String(i.user_agent||'').toLowerCase(),vp=String(i.viewport||'');if(/android/.test(ua))return {key:'android',label:'Android'};if(/iphone|ipad|ipod/.test(ua))return {key:'ios',label:/ipad/.test(ua)?'iPad':'iPhone'};if(/windows|macintosh|cros|linux/.test(ua))return {key:'desktop',label:'Desktop'};if(/^\d+\s*[×x]\s*\d+$/.test(vp)&&Number(vp.split(/[×x]/)[0].trim())<=900)return {key:'unknown',label:'Mobile / unknown'};return {key:'unknown',label:'Unknown device'};}
    function populateIssueFilters(){const tester=document.getElementById('issueTesterFilter');if(!tester)return;const selected=tester.value||'all',people=[...new Map(allIssues.map(i=>[String(i.user_id),i.user_name||i.user_email||`User ${i.user_id}`])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));tester.innerHTML='<option value="all">All Testers</option>'+people.map(([id,name])=>`<option value="${esc(id)}">${esc(name)}</option>`).join('');tester.value=people.some(([id])=>id===selected)?selected:'all';}
    function issueCounts(rows){
      const counts={work:0,awaiting:0,resolved:0,closed:0,urgent:0};
      for(const i of rows){const status=i.management_status||'new';
        if(['resolved','tester_confirmed'].includes(status))counts.resolved++;
        else if(status==='wont_fix')counts.closed++;
        else if(status==='ready_to_test'&&i.verification&&i.release_reference)counts.awaiting++;
        else counts.work++;
        if(!['resolved','tester_confirmed','wont_fix'].includes(status)&&i.priority==='urgent')counts.urgent++;
      }return counts;
    }
    function renderIssueComparison(rows){
      const box=document.getElementById('issueComparison');if(!box)return;
      const groups=new Map();
      for(const i of rows){const name=i.user_name||i.user_email||`User ${i.user_id}`,device=issueDevice(i).label,key=`${i.user_id}|${device}`,group=groups.get(key)||{name,device,rows:[]};group.rows.push(i);groups.set(key,group);}
      const list=[...groups.values()].sort((a,b)=>b.rows.length-a.rows.length||a.name.localeCompare(b.name));
      box.innerHTML=list.length?'<b>Tester and device comparison</b><br>'+list.map(g=>{const c=issueCounts(g.rows);return `${esc(g.name)} · ${esc(g.device)}: ${g.rows.length} reports, ${c.work} need work, ${c.awaiting} awaiting retest, ${c.resolved} resolved${c.closed?`, ${c.closed} closed without a fix`:''}`;}).join('<br>'):'<span class="muted">No reports match these filters.</span>';
    }
    function issueOptions(values,labels,current){return values.map(v=>`<option value="${v}"${v===current?' selected':''}>${labels[v]}</option>`).join('');}
    function renderIssues(){

      const closed=new Set(['resolved','wont_fix','tester_confirmed']);
      const scope=allIssues.filter(i=>(pf==='all'||(i.priority||'normal')===pf)&&(tf==='all'||String(i.user_id)===tf)&&(df==='all'||issueDevice(i).key===df));
      const rows=scope.filter(i=>sf==='all'||(sf==='open'&&!closed.has(i.management_status||'new'))||i.management_status===sf);
      const counts=issueCounts(scope);

      renderIssueComparison(scope);
      box.innerHTML=rows.length?rows.map(issueCard).join(''):'<p class="helper">No issue reports match these filters.</p>';
      for(const issue of rows.filter(i=>i.voice_path)){
        const save=box.querySelector(`[data-issue-save="${issue.id}"]`);if(!save)continue;
        const player=document.createElement('div');player.className='admin-panel';player.innerHTML=`<b>Voice description</b><audio controls preload="metadata" src="${esc(issue.voice_path)}" style="display:block;width:100%;margin-top:6px"></audio>`;save.closest('.issue-actions').before(player);
      }
      for(const i of rows){const card=box.querySelector(`[data-issue-save="${i.id}"]`)?.closest('.issue-admin-card');if(!card)continue;const section=document.createElement('details');section.innerHTML=`<summary>Repair history and verification</summary><p>Version: ${esc(i.reported_edition||'Legacy / unknown')} · App build: ${esc(i.app_version||'unknown')}</p>${i.blocked_reason?`<p>${esc(i.blocked_reason)}</p>`:''}${i.verification?`<pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(i.verification)}</pre>`:''}<div data-history>Open to load repair history.</div>`;section.ontoggle=async()=>{if(!section.open||section.dataset.loaded)return;const r=await api(`/api/issues/${i.id}/history`);if(r.ok){const history=await r.json();section.querySelector('[data-history]').innerHTML=history.length?history.map(h=>`<p><strong>${esc(h.event)}</strong> · ${esc(fdatetime(h.created_at))}<br>${esc(h.detail)}</p>`).join(''):'No automated repair history yet.';section.dataset.loaded='true';}};card.appendChild(section);}
      box.querySelectorAll('[data-issue-save]').forEach(b=>b.onclick=()=>saveIssue(Number(b.dataset.issueSave),b));
      box.querySelectorAll('[data-issue-retry]').forEach(b=>b.onclick=()=>retryIssueEmail(Number(b.dataset.issueRetry),b));
      for(const issue of rows.filter(i=>i.management_status==='ready_to_test')){
        const save=box.querySelector(`[data-issue-save="${issue.id}"]`);if(!save)continue;
        const copy=document.createElement('button');copy.className='btn secondary';copy.type='button';copy.textContent='Copy Retest Message';copy.onclick=()=>copyRetestMessage(issue);save.parentElement.appendChild(copy);
        if(!['marked_by_sam','in_app'].includes(issue.tester_notification_status)){
          const mark=document.createElement('button');mark.className='btn secondary';mark.type='button';mark.textContent='Mark Tester Notified';mark.onclick=()=>markTesterNotified(issue.id,mark);save.parentElement.appendChild(mark);
        }
      }
    }
    function issueCard(i){

      const device=issueDevice(i);
      return `<article class="card issue-admin-card">${i.screenshot_path?`<a href="${esc(i.screenshot_path)}" target="_blank" rel="noopener"><img src="${esc(i.screenshot_path)}" alt="Issue ${i.id} screenshot"></a>`:'<div class="muted">No screenshot</div>'}<div><div class="user-title-row"><div class="userhead">Issue #${i.id}: ${esc(i.page_name||'Photo Notes')}</div><span class="pill ${status==='resolved'?'pro':priority==='urgent'?'role':'basic'}">${esc(status==='ready_to_test'&&(!i.verification||!i.release_reference)?'Ready status needs verification':issueStatusLabels[status]||status)}</span><span class="pill basic">${esc(issuePriorityLabels[priority]||priority)} Priority</span></div><div class="muted">${esc(i.user_name||i.user_email)} · ${fdatetime(i.created_at)} · ${esc(i.viewport||'screen unknown')}<span class="issue-device">${esc(device.label)}</span></div><div class="issue-description">${esc(i.description)}</div><div class="muted">${esc(i.page_url||'')}</div><div class="issue-controls"><label>Status<select id="issue-status-${i.id}">${issueOptions(Object.keys(issueStatusLabels),issueStatusLabels,status)}</select></label><label>Priority<select id="issue-priority-${i.id}">${issueOptions(Object.keys(issuePriorityLabels),issuePriorityLabels,priority)}</select></label></div><label for="issue-fix-${i.id}">What Was Fixed</label><textarea class="issue-notes" id="issue-fix-${i.id}" placeholder="Short explanation the tester can understand">${esc(i.fix_summary||'')}</textarea><label for="issue-release-${i.id}">Release or Commit</label><input id="issue-release-${i.id}" value="${esc(i.release_reference||'')}" placeholder="Commit, deployment, or release reference"><label for="issue-retest-${i.id}">Retest Instructions</label><textarea class="issue-notes" id="issue-retest-${i.id}" placeholder="Exact steps the tester should repeat">${esc(i.retest_instructions||'')}</textarea><label for="issue-blocked-${i.id}">Question or Blocker Visible to Reporter</label><textarea class="issue-notes" id="issue-blocked-${i.id}" placeholder="What information is needed to continue?">${esc(i.blocked_reason||'')}</textarea><label for="issue-notes-${i.id}" style="margin-top:8px">Private Administrator Notes</label><textarea class="issue-notes" id="issue-notes-${i.id}" placeholder="Internal diagnosis and decisions">${esc(i.admin_notes||'')}</textarea><div class="muted">Original report email: ${esc(i.email_status||'pending')}${i.email_error?' · '+esc(i.email_error):''}<br>Tester notification: ${esc(i.tester_notification_status||'not sent')}${i.tester_notification_error?' · '+esc(i.tester_notification_error):''}${i.tester_notified_at?' · '+fdatetime(i.tester_notified_at):''}${i.tester_result?`<br>Retest result: ${i.tester_result==='fixed'?'Fixed':'Still happening'}${i.tester_retested_at?' · '+fdatetime(i.tester_retested_at):''}${i.tester_notes?' · '+esc(i.tester_notes):''}`:''}${i.updated_at?'<br>Last updated '+fdatetime(i.updated_at):''}</div><div class="issue-actions"><button class="btn" type="button" data-issue-save="${i.id}">Save Issue</button>${i.email_status!=='sent'?`<button class="btn secondary" type="button" data-issue-retry="${i.id}">Retry Email</button>`:''}</div></div></article>`;
    }
    async function loadIssues(){
      api('/api/admin/cloud-worker').then(r=>r.json()).then(d=>{const el=document.getElementById('repairWorkerStatus');if(el){const p=document.createElement('p');p.style.color='#000';p.id='cloudWorkerDetail';document.getElementById(p.id)?.remove();const healthy=d.last_tick&&Date.now()-Date.parse(d.last_tick)<60000;p.textContent=`Server worker: ${healthy?'running':'not recently observed'}. Repair dispatch: ${d.runner_enabled&&d.dispatch_configured?'enabled':'not connected'}. Last dispatch check: ${d.last_dispatch_check?fdatetime(d.last_dispatch_check):'not yet observed'}. AI credential: ${d.runner_configured?'configured':'not verified'}. Devices subscribed: ${d.subscribed_devices||0}. Failed notification deliveries: ${d.failed_deliveries||0}. ${d.dispatch_error||d.last_error||''}`;el.after(p);}}).catch(()=>{});
      api('/api/admin/repair-status').then(r=>r.json()).then(d=>{const el=document.getElementById('repairWorkerStatus');if(el)el.textContent=`Repair queue: ${d.queue_configured?'connected':'not configured'}. Last worker check: ${d.last_checked?fdatetime(d.last_checked):'not yet observed'}. Notifications: in-app${d.email_configured?' and configured email':'; email not configured'}.`;}).catch(()=>{});
      const box=document.getElementById('issues'); if(!box)return; box.innerHTML='<p class="status">Loading...</p>';
      try{const r=await api('/api/admin/issues');if(!r.ok)throw new Error();allIssues=await r.json();populateIssueFilters();renderIssues();}
      catch(e){box.innerHTML='<p class="status">Issue reports could not be loaded.</p>';}
    }
    async function saveIssue(id,btn){
      btn.disabled=true;btn.textContent='Saving...';
      const body={blocked_reason:document.getElementById(`issue-blocked-${id}`).value,management_status:document.getElementById(`issue-status-${id}`).value,priority:document.getElementById(`issue-priority-${id}`).value,fix_summary:document.getElementById(`issue-fix-${id}`).value,release_reference:document.getElementById(`issue-release-${id}`).value,retest_instructions:document.getElementById(`issue-retest-${id}`).value,admin_notes:document.getElementById(`issue-notes-${id}`).value};
      try{const r=await api(`/api/admin/issues/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error();toast('Issue saved');await loadIssues();loadActivity();}
      catch(e){toast('Issue could not be saved');btn.disabled=false;btn.textContent='Save Issue';}
    }
    async function retryIssueEmail(id,btn){
      btn.disabled=true;btn.textContent='Sending...';
      try{const r=await api(`/api/admin/issues/${id}/retry-email`,{method:'POST'});const d=await r.json();if(!r.ok)throw new Error();toast(d.status==='sent'?'Issue email sent':'Email is still not configured');await loadIssues();loadActivity();}
      catch(e){toast('Issue email could not be sent');btn.disabled=false;btn.textContent='Retry Email';}
    }
    async function copyRetestMessage(i){
      const message=`Photo Notes issue #${i.id} is ready for you to retest.\n\nWhat changed: ${i.fix_summary||'A correction has been deployed.'}\n\nPlease retest: ${i.retest_instructions||'Refresh Photo Notes and repeat the steps that caused the problem.'}\n\nAfterward, open My Issue Reports and choose Fixed on my device or Still happening.`;
      try{await navigator.clipboard.writeText(message);toast('Retest message copied — you decide when and how to send it');}catch(e){toast('Retest message could not be copied');}
    }
    async function markTesterNotified(id,btn){
      btn.disabled=true;btn.textContent='Saving...';
      try{const r=await api(`/api/admin/issues/${id}/mark-tester-notified`,{method:'POST'});if(!r.ok)throw new Error();toast('Recorded that Sam notified the tester');await loadIssues();loadActivity();}
      catch(e){toast('Notification status could not be saved');btn.disabled=false;btn.textContent='Mark Tester Notified';}
    }
    async function loadHealth(){
      const box=document.getElementById('health'); if(!box)return;
      try{const r=await api('/api/admin/health');if(!r.ok)throw new Error();const d=await r.json();box.innerHTML=`<div class="muted health-meta">Version ${esc(d.version)} · ${esc(d.environment)} · Checked ${fdatetime(d.checked_at)} · Uptime ${Math.floor((d.uptime_seconds||0)/60)} minutes</div><div class="health-grid">${d.services.map(s=>`<div class="health-card"><div class="health-name"><span class="health-dot ${s.status==='down'?'down':s.status==='not_configured'?'warning':''}"></span>${esc(s.name)}</div><div class="health-detail">${esc(s.detail)}</div></div>`).join('')}</div>`;}
      catch(e){box.innerHTML='<p class="status">System health could not be checked.</p>';}
    }

    async function loadStripeBilling(){const status=document.getElementById('stripeStatus'),activity=document.getElementById('stripeActivity'),panel=document.getElementById('stripeInvoicePanel');try{const [cr,sr]=await Promise.all([api('/api/billing/config'),api('/api/admin/billing/status')]);if(!cr.ok||!sr.ok)throw new Error();const d=await cr.json(),s=await sr.json();status.textContent=d.invoicing_enabled?'Stripe key is configured. Draft invoices are available.':'Stripe is not configured yet. Add the server key through the deployment environment before creating invoices.';panel.hidden=!d.invoicing_enabled;if(d.invoicing_enabled)document.getElementById('stripeCreateInvoice').onclick=createStripeInvoice;const important=['checkout.session.completed','invoice.paid','charge.refunded'];activity.innerHTML=`<b>${esc(s.environment==='live'?'Live':'Sandbox')} webhook activity</b> · ${s.webhook_configured?'Signing secret configured':'Signing secret missing'}<br>${important.map(k=>`${esc(k)}: ${s.counts[k]||0}`).join(' · ')}${s.events.length?'<br>Latest: '+s.events.slice(0,8).map(e=>`${esc(e.event_type)} · ${fdatetime(e.processed_at)}`).join('<br>'):'<br>No Stripe webhook events have been recorded yet.'}`;}catch(e){status.textContent='Stripe configuration could not be checked.';activity.textContent='Stripe activity could not be loaded.';panel.hidden=true;}}
    async function createStripeInvoice(){const button=document.getElementById('stripeCreateInvoice'),amount=Math.round(Number(document.getElementById('stripeAmount').value)*100),body={customer_name:document.getElementById('stripeCustomerName').value.trim(),email:document.getElementById('stripeCustomerEmail').value.trim(),dba:document.getElementById('stripeDba').value,due_days:Number(document.getElementById('stripeDue').value),items:[{description:document.getElementById('stripeDescription').value.trim(),quantity:1,unit_amount:amount}]};button.disabled=true;button.textContent='Creating...';try{const r=await api('/api/admin/billing/invoices',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':`invoice-${Date.now()}-${crypto.randomUUID()}`},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'failed');document.getElementById('stripeInvoiceResult').textContent=`Draft ${d.invoice_id} created. Review and send it from the Stripe Dashboard.`;toast('Stripe draft invoice created');}catch(e){toast('Draft invoice could not be created');}finally{button.disabled=false;button.textContent='Create Draft Invoice';}}

    function generatePassword(){
      const chars=strongPasswordCharacters(20);
      document.getElementById('cpass').value=chars;
      document.getElementById('passhelp').textContent='Strong password generated. Copy it before creating the login.';
    }

    function strongPasswordCharacters(length){
      const upper='ABCDEFGHJKLMNPQRSTUVWXYZ', lower='abcdefghijkmnopqrstuvwxyz', digits='23456789', symbols='!@#$%*-_';
      const all=upper+lower+digits+symbols;
      const pick=(chars) => chars[crypto.getRandomValues(new Uint32Array(1))[0] % chars.length];
      const chars=[pick(upper),pick(lower),pick(digits),pick(symbols)];
      while(chars.length<length) chars.push(pick(all));
      for(let i=chars.length-1;i>0;i--){ const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1); [chars[i],chars[j]]=[chars[j],chars[i]]; }
      return chars.join('');
    }

    async function copyPassword(){
      const input=document.getElementById('cpass');
      if(!input.value){ toast('Generate or enter a password first'); return; }
      try { await navigator.clipboard.writeText(input.value); toast('Password copied'); }
      catch(e){ input.select(); document.execCommand('copy'); toast('Password copied'); }
    }

    async function createUser(){
      const name = document.getElementById('cname').value.trim();
      const email = document.getElementById('cemail').value.trim();
      const industry = document.getElementById('cindustry').value.trim();
      const edition_access=[...document.querySelectorAll('[data-version-owner="new"]:checked')].map(x=>x.value);
      if(!edition_access.length){toast('Select at least one version');return;}
      const password = document.getElementById('cpass').value;
      if (name.split(/\s+/).filter(Boolean).length < 2) { toast('First and last name are required'); return; }
      if (!email || !password) { toast('Email and password are required'); return; }
      const btn = document.getElementById('createbtn'); btn.disabled = true; btn.textContent = 'Creating...';
      try {
        const r = await api('/api/admin/users', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, email, industry, password, edition_access }) });
        if (r.status === 409) { toast('That email already has a login'); }
        else if (!r.ok) { toast('Could not create login'); }
        else {
          toast('Login created');document.getElementById('createUserPanel').hidden=true;document.getElementById('addUser').setAttribute('aria-expanded','false');selectedUserId=null;
          document.getElementById('cname').value=''; document.getElementById('cemail').value='';
          document.getElementById('cindustry').value=''; document.getElementById('cpass').value='';
          loadUsers();
          loadActivity();
        }
      } catch(e){ toast('Could not create login'); }
      finally { btn.disabled = false; btn.textContent = 'Create User'; }
    }

    async function loadUsers(){
      const box = document.getElementById('users');
      box.innerHTML = '<p class="status">Loading...</p>';
      try {
      const [r,ur] = await Promise.all([api('/api/admin/users'),api('/api/admin/usage').catch(()=>({ok:false}))]);
      if (!r.ok) { box.innerHTML = '<p class="status">Could not load.</p>'; return; }
      allUsers = await r.json();
      if(ur.ok){const rows=await ur.json();usageByUser=Object.fromEntries(rows.map(x=>[x.user_id,x]));}
      renderSummary(allUsers);
      const sortsel = document.getElementById('sortsel');
      if (sortsel && !sortsel._wired) { sortsel._wired = true; sortsel.onchange = renderUserList; }
      renderUserList();
      }catch(e){box.innerHTML='<p class="status">Users could not be loaded. <button type="button" id="retryUsers">Retry</button></p>';document.getElementById('retryUsers').onclick=loadUsers;}
    }

    function formatBytes(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB';}
    function featureToggle(id,key,label,features){const checked=features[key]!==false;return `<label class="feature-item"><input type="checkbox" data-feature-key="${key}" data-feature-owner="${id}"${checked?' checked':''}><span>${label}</span></label>`;}
    function toggleAdminPanel(id){const p=document.getElementById(id);if(p)p.hidden=!p.hidden;}
    async function saveUserDetails(id,btn){
      const body={name:document.getElementById(`edit-name-${id}`).value.trim(),email:document.getElementById(`edit-email-${id}`).value.trim(),industry:document.getElementById(`edit-industry-${id}`).value.trim()};
      if(body.name.split(/\s+/).filter(Boolean).length<2){toast('First and last name are required');return;}
      if(!body.email){toast('Email is required');return;}btn.disabled=true;btn.textContent='Saving...';
      try{const r=await api(`/api/admin/users/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status===409){toast('That email already has a login');return;}if(!r.ok)throw new Error();toast('User saved');await loadUsers();await loadActivity();}catch(e){toast('User could not be saved');}finally{btn.disabled=false;btn.textContent='Save User';}
    }
    async function saveFeatureAccess(id,btn){
      const feature_access={};document.querySelectorAll(`[data-feature-owner="${id}"]`).forEach(c=>feature_access[c.dataset.featureKey]=c.checked);btn.disabled=true;btn.textContent='Saving...';
      try{const r=await api(`/api/admin/users/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feature_access})});if(!r.ok)throw new Error();toast('Feature access saved');await loadUsers();await loadActivity();}catch(e){toast('Feature access could not be saved');}finally{btn.disabled=false;btn.textContent='Save Feature Access';}
    }
    const activityLabels={admin_user_delete:'Permanently deleted user',admin_user_create:'Created login',admin_user_update:'Changed user settings',admin_password_reset:'Reset password',admin_issue_update:'Updated issue',admin_issue_email_retry:'Retried issue email'};
    async function loadActivity(){
      const box=document.getElementById('activity');if(!box)return;
      try{const r=await api('/api/admin/activity');if(!r.ok)throw new Error();const rows=await r.json();box.innerHTML=rows.length?`<table class="activity-table"><thead><tr><th>When</th><th>Administrator</th><th>Action</th><th>Details</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${fdatetime(a.created_at)}</td><td>${esc(a.admin_name||a.admin_email||'Administrator')}</td><td>${esc(activityLabels[a.action]||a.action)}</td><td>${esc(activityDetail(a))}</td></tr>`).join('')}</tbody></table>`:'<p class="helper">No administrative changes have been recorded yet.</p>';}
      catch(e){box.innerHTML='<p class="status">Administrative activity could not be loaded.</p>';}
    }
    function activityDetail(a){const d=a.detail||{};if(d.target_user_id)return `User #${d.target_user_id}${Array.isArray(d.fields)?' · '+d.fields.join(', '):''}`;if(d.issue_id)return `Issue #${d.issue_id}`;return '';}

    function toggleResetPassword(id){
      const panel=document.getElementById(`reset-panel-${id}`);
      if(!panel)return;
      panel.hidden=!panel.hidden;
      if(!panel.hidden) document.getElementById(`reset-password-${id}`).focus();
    }
    function recommendResetPassword(id){
      const input=document.getElementById(`reset-password-${id}`);
      input.value=strongPasswordCharacters(10);
      document.getElementById(`reset-help-${id}`).textContent='Strong 10-character password recommended. Copy it, then save it.';
      input.focus(); input.select();
    }
    async function copyResetPassword(id){
      const input=document.getElementById(`reset-password-${id}`);
      if(!input.value){toast('Recommend or enter a password first');return;}
      try{await navigator.clipboard.writeText(input.value);toast('Password copied');}
      catch(e){input.select();document.execCommand('copy');toast('Password copied');}
    }
    async function saveResetPassword(id,btn){
      const input=document.getElementById(`reset-password-${id}`),pw=input.value;
      if(pw.length<10){toast('Password must be at least 10 characters');input.focus();return;}
      btn.disabled=true;btn.textContent='Saving...';
      try{
        const r=await api(`/api/admin/users/${id}/password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
        if(!r.ok)throw new Error();
        toast('Password saved');
        loadActivity();
        document.getElementById(`reset-help-${id}`).textContent='Password saved. Give the copied password to the user securely.';
      }catch(e){toast('Password could not be saved');}
      finally{btn.disabled=false;btn.textContent='Save Password';}
    }
    async function prepareDeleteUser(id,button){
      const panel=document.getElementById(`delete-user-${id}`);
      panel.hidden=false;panel.innerHTML='<p role="status">Checking this account...</p>';button.disabled=true;
      try{
        const r=await api(`/api/admin/users/${id}/deletion`),d=await r.json();
        if(!r.ok)throw new Error(d.error||'Deletion details could not be loaded');
        panel.innerHTML=`<h3>Delete User Permanently</h3><p><strong>${esc(d.user.name||d.user.email)}</strong><br>${esc(d.user.email)}</p>${d.blocked?`<p role="alert">${esc(d.blocked)}</p>`:`<p>This removes the login, ${num(d.counts.photos)} Photo Notes, ${num(d.counts.documents)} documents, ${num(d.counts.issue_reports)} issue reports, ${num(d.counts.assignments)} testing assignments, and their other private app records and attachments. This cannot be undone.</p><label for="delete-email-${id}">Type ${esc(d.user.email)} to confirm</label><input id="delete-email-${id}" type="email" autocomplete="off" spellcheck="false"><button class="btn delete-user-button" type="button" id="confirmDeleteUser" disabled>Delete Permanently</button>`}<button class="btn secondary" type="button" id="cancelDeleteUser">Cancel</button><p id="deleteStatus" role="status"></p>`;
        const cancel=document.getElementById('cancelDeleteUser');cancel.onclick=()=>{panel.hidden=true;panel.innerHTML='';button.focus();};
        if(!d.blocked){
          const input=document.getElementById(`delete-email-${id}`),confirm=document.getElementById('confirmDeleteUser');
          input.oninput=()=>confirm.disabled=input.value!==d.user.email;
          confirm.onclick=async()=>{
            confirm.disabled=true;cancel.disabled=true;input.disabled=true;confirm.textContent='Deleting...';
            try{
              const result=await api(`/api/admin/users/${id}`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm_email:input.value})});
              const data=await result.json();if(!result.ok)throw new Error(data.error||'User could not be deleted');
              selectedUserId=null;await loadUsers();
              const assignments=document.querySelector('[data-admin-tool="testing"]');if(assignments){delete assignments.dataset.loaded;if(assignments.open)loadAssignments();}
              const issues=document.querySelector('[data-admin-tool="issues"]');if(issues){delete issues.dataset.loaded;if(issues.open)loadIssues();}
              loadActivity();toast(data.file_cleanup_pending?'User deleted. Attachment cleanup is pending.':'User permanently deleted');
            }catch(e){document.getElementById('deleteStatus').textContent=e.message;confirm.disabled=false;cancel.disabled=false;input.disabled=false;confirm.textContent='Delete Permanently';}
          };
          input.focus();
        }
      }catch(e){panel.innerHTML=`<p role="alert">${esc(e.message)}</p>`;}
      finally{button.disabled=false;}
    }
    async function setActive(id, active){
      if (!active && !confirm('Deactivate this login? They will not be able to sign in. Their data is kept.')) return;
      const r = await api(`/api/admin/users/${id}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ active }) });
      if (r.ok) { toast(active ? 'Activated' : 'Deactivated'); loadUsers(); loadActivity(); } else toast('Update failed');
    }


    boot();
  </script>
